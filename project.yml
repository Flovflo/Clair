name: Clair
options:
  bundleIdPrefix: local.clair
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  Clair:
    type: application
    platform: macOS
    sources:
      - path: Sources/Clair
      - path: Sources/CleanerCore
      - path: Resources
        excludes: [Info.plist, AppIcon.iconset]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.clair.mac
        PRODUCT_NAME: Clair
        INFOPLIST_FILE: Resources/Info.plist
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Clair:
    build:
      targets:
        Clair: all
    run:
      config: Debug
    archive:
      config: Release
