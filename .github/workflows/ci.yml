name: macOS checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test filesystem and cleanup boundaries
        run: bash scripts/test.sh
      - name: Build the native application
        run: swift build -c release
